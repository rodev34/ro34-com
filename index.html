<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RO34 Performance — Coming soon</title>
<meta name="description" content="RO34 Performance is coming to the USA: aero kits and performance parts.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta property="og:title" content="RO34 Performance — Coming soon">
<meta property="og:description" content="Aero kits &amp; performance parts. Coming soon to the USA.">
<meta property="og:image" content="https://ro34.com/assets/ro34-logo.png">
<meta property="og:url" content="https://ro34.com/">

<style>
  @font-face {
    font-family: "Montserrat";
    src: url("assets/montserrat-latin.woff2") format("woff2");
    font-weight: 400 800;
    font-display: swap;
  }
  :root {
    --bg: #09090b;
    --card: rgba(255,255,255,.04);
    --card-hover: rgba(255,255,255,.07);
    --line: rgba(255,255,255,.09);
    --text: #f5f5f6;
    --muted: #9b9ba4;
    --red: #DF0600;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(223,6,0,.22), transparent 60%),
      radial-gradient(80% 40% at 50% 110%, rgba(223,6,0,.08), transparent 70%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Geeza Pro", "Noto Sans Arabic", sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 44px 16px 36px;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 440px; text-align: center; }
  .logo { width: 260px; max-width: 76%; height: auto; display: block; margin: 0 auto 20px; filter: drop-shadow(0 6px 24px rgba(223,6,0,.25)); }
  .bio { margin: 0 0 34px; }
  .bio p { margin: 0 0 4px; font-size: 15px; font-weight: 600; line-height: 1.5; }
  .bio .es, .bio .ar { color: var(--muted); font-size: 13px; font-weight: 500; }
  .group {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 16px 14px 6px; margin-bottom: 18px; text-align: left;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .section, .subsection {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); margin: 0 4px 12px;
  }
  .section { color: var(--text); }
  .subsection { font-weight: 600; letter-spacing: .12em; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .section span[lang="ar"], .subsection span[lang="ar"] { letter-spacing: 0; text-transform: none; font-size: 12px; font-weight: 500; }
  .btn {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: rgba(255,255,255,.03); border: 1px solid var(--line);
    color: var(--text); text-decoration: none;
    padding: 14px 14px 14px 16px; border-radius: 12px; margin-bottom: 10px;
    font-size: 15px; font-weight: 700; text-align: left;
    position: relative; overflow: hidden;
    transition: background .2s, border-color .2s, transform .2s;
  }
  a.btn::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--red); }
  a.btn:hover, a.btn:focus-visible { background: var(--card-hover); border-color: rgba(223,6,0,.6); transform: translateY(-1px); outline: none; }
  .btn small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); margin-top: 3px; }
  .btn .arrow {
    flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    background: var(--red); color: #fff; font-size: 15px; font-weight: 700;
    transition: transform .2s;
  }
  a.btn:hover .arrow { transform: translateX(2px); }
  .btn.soon { color: var(--muted); background: transparent; border-style: dashed; }
  .btn.soon .badge {
    flex: none; font-size: 10px; font-weight: 600; letter-spacing: .04em; line-height: 1.35; text-align: center;
    color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 5px 9px;
  }
  .social { display: flex; justify-content: center; gap: 10px; margin: 26px 0 28px; flex-wrap: wrap; }
  .social a {
    width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center;
    background: var(--card); border: 1px solid var(--line); color: var(--text);
    transition: background .2s, border-color .2s, transform .2s;
  }
  .social a:hover, .social a:focus-visible { background: var(--red); border-color: var(--red); transform: translateY(-2px); outline: none; }
  .social svg { width: 19px; height: 19px; fill: currentColor; }
  footer { font-size: 11px; color: var(--muted); line-height: 1.8; letter-spacing: .02em; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style>
  body { align-items: center; }
  .soon-title { font-size: 26px; font-weight: 800; letter-spacing: -.01em; margin: 6px 0 8px; }
  .soon-title em { font-style: normal; color: var(--red); }
  .lead { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0 0 30px; }
  .contact { font-size: 13px; color: var(--muted); margin: 0 0 4px; }
  .contact a { color: var(--text); font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--red); }
</style>
